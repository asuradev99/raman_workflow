# hBN PBEsol 9x9x1 defect supercell — boron vacancy VB-
use_gam: true
phonopy:
  dim: "1 1 1"
start_from_supercell: true
compute_mode: "sbatch_mix"

compute_modes:
  sbatch_mix:
    sbatch_relax: "--nodes=4 --gpus-per-node=4 --ntasks-per-node=4 --cpus-per-task=32 --time=01:00:00 --qos=regular --constraint=gpu -A m526"
    srun_relax: "--nodes=4 --cpu_bind=cores --gpus-per-node=4 --ntasks-per-node=4  --cpus-per-task=32 -C gpu"
    srun_per_dir: "--cpu_bind=cores --gpus-per-node=4 --ntasks-per-node=4 --nodes=1 --cpus-per-task=32 -C gpu"
    srun_cpu_relax: "--cpu_bind=cores --nodes=1 --ntasks=16 --cpus-per-task=4"
    sbatch: "--nodes=108 --gpus-per-node=4 --ntasks-per-node=4 --cpus-per-task=32 --time=03:00:00 --qos=regular --constraint=gpu -A m526"
    salloc_post: "--nodes=4 --gpus-per-node=4 --ntasks-per-node=4 --cpus-per-task=32 --time=04:00:00 --qos=interactive --constraint=gpu -A m526"
  interactive_serial:
    srun_relax: "--cpu_bind=cores --gpus-per-node=4 --ntasks-per-node=4 --nodes=4 --cpus-per-task=32 -C gpu"
    srun_cpu_relax: "--cpu_bind=cores --nodes=4 --ntasks-per-node=16 --cpus-per-task=4"
    salloc: "-N 4 -C gpu --gpus-per-node=4 -t 04:00:00 --qos=interactive -A m526"

