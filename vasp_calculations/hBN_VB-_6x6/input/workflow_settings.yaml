# hBN PBEsol 6x6x1 defect supercell — boron vacancy VB- (71 atoms: 35 B + 36 N)
# Z-lattice reduced from 27 → 18 Å. Optimized: 3x3 k-points, ENCUT=400.
# NELECT = 286 (35*3 + 36*5 = 285, +1 for the -1 charge).
# Spin: ISPIN = 2 (shared template) + MAGMOM = 71*1 seeds a moment on every atom,
#   matching the 9x9 VB- convention. Not gamma-only (3x3x1 k-points) → use_gam OFF.

phonopy:
  dim: "1 1 1"
start_from_supercell: true
compute_mode: "sbatch_mix"

compute_modes:
  sbatch_mix:
    sbatch_relax: "--nodes=4 --gpus-per-node=4 --ntasks-per-node=4 --cpus-per-task=32 --time=01:00:00 --qos=regular --constraint=gpu -A m526"
    srun_relax: "--nodes=4 --cpu_bind=cores --gpus-per-node=4 --ntasks-per-node=4 --cpus-per-task=32 -C gpu"
    srun_per_dir: "--cpu_bind=cores --gpus-per-node=4 --ntasks-per-node=4 --nodes=1 --cpus-per-task=32 -C gpu"
    srun_cpu_relax: "--cpu_bind=cores --nodes=1 --ntasks=16 --cpus-per-task=4"
    sbatch: "--nodes=48 --gpus-per-node=4 --ntasks-per-node=4 --cpus-per-task=32 --time=04:00:00 --qos=regular --constraint=gpu -A m526"

steps:
  defect_relax_1:
    kpoints: {mesh: "2 2 1"}
    incar_overrides: |
      NELECT = 286
      GGA = PS
      ENCUT = 400
      KPAR = 4
      NPAR = 4
      MAGMOM = 71*1
  hf_setup: {}
  force_consts:
    kpoints: {mesh: "2 2 1"}
    incar_overrides: |
      NELECT = 286
      GGA = PS
      ENCUT = 400
      KPAR = 4
      NPAR = 4
      MAGMOM = 71*1
  phonon_post: {}
  raman_prep: {}
  resonant_vasp:
    kpoints: {mesh: "2 2 1"}
    incar_overrides: |
      ENCUT = 400
      NELECT = 286
      GGA = PS
      NBANDS = 537
      KPAR = 4
      NPAR = 4
      MAGMOM = 71*1
  post_process:
    symmetry_filter:
      enabled: true
      allowed_irreps: ["A1'", "E'"]
    desired_energies:
      - "0.00"
      - "0.20"
      - "0.40"
      - "0.60"
      - "0.80"
      - "1.00"
      - "1.20"
      - "1.40"
      - "1.60"
      - "1.80"
      - "1.96"
      - "2.00"
      - "2.20"
      - "2.33"


